<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factura de Venta</title>

<link rel="stylesheet" href="Css/estilos.css">
<link rel="stylesheet" href="Css/factura.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>


<body>

    <script>
    // Actualiza el contador del carrito en el navbar, leyendo lo guardado en el catálogo
    document.addEventListener("DOMContentLoaded", () => {
        const carrito = JSON.parse(localStorage.getItem("carritoGameVault")) || [];
        const totalCantidad = carrito.reduce((sum, item) => sum + item.quantity, 0);
        const cartCountEl = document.getElementById("cart-count");
        if (cartCountEl) {
            cartCountEl.textContent = totalCantidad;
        }
    });
</script>
    
    <!-- Barra de Navegación -->
    <header>
        <nav class="navbar">
            <div class="logo">GameVault</div>
            <ul class="nav-links">
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="cotizacion.html">Cotizacion</a></li>
                 <li><a href="factura.html">facturacion</a></li>
                <li>  
                    <button class="cart-badge-btn">
                        🛒 Carrito (<span id="cart-count">0</span>)
                    </button>
                </li>
            </ul>
        </nav>
    </header>


<div class="main-container">


<header>

<nav class="navbar">

<div class="logo">
GameVault
</div>


<ul class="nav-links">

<li>
<a href="index.html">Categoria</a>
</li>

<li>
<a href="cotizacion.html">Cotización</a>
</li>

</ul>

</nav>

</header>



<section class="factura-card" id="documento-factura">


<header class="factura-header">


<div>

<h1>
GameVault
</h1>

<p>
NIT: 322.729.5381
</p>

<p>
GameVault@gmail.com
</p>

</div>



<div>

<h2>
FACTURA DE VENTA
</h2>


<label>
Número:
<input id="numero-factura" value="FAC-001">
</label>


<label>
Fecha:
<input type="date" id="fecha-factura">
</label>


</div>


</header>



<section class="cliente-container">

<h3>
Datos del Cliente
</h3>


<input id="cliente" placeholder="Nombre cliente">

<input id="documento" placeholder="Documento">

<input id="correo" placeholder="Correo">


</section>



<table class="tabla-factura">


<thead>

<tr>

<th>
Producto
</th>

<th>
Cantidad
</th>

<th>
Valor Unitario
</th>

<th>
Total
</th>

</tr>

</thead>


<tbody id="factura-body">

</tbody>


</table>



<div class="totales-box">

<p>
Subtotal:
<span id="subtotal"></span>
</p>


<p>
IVA:
<span id="iva"></span>
</p>


<h3>
Total:
<span id="total"></span>
</h3>


</div>



</section>



<button id="btn-pdf">
Generar PDF
</button>


</div>



<script src="java scrip/factura.js"></script>


</body>
</html>
